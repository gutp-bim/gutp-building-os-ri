# Building OS E2E 評価 KPI ゲート（機械可読）。
# runner/ が結果 JSON をこの閾値と突き合わせて pass/fail を判定する。
# 数値は docs/operations/oss-warm-parquet-kpi.md と plan.md の表に整合。
# 比較演算子: lte (<=), lt (<), gte (>=), gt (>), eq (==)。
version: 1

axes:
  E1_ingest_throughput:
    sustained_throughput_ratio: { op: gte, value: 0.99, unit: ratio }   # 目標 rate 維持率
    loss_rate:                  { op: lte, value: 0.01, unit: ratio }
    duplicate_rate:             { op: lte, value: 0.005, unit: ratio }
    validation_error_rate:      { op: lte, value: 0.01, unit: ratio }

  E2_ingest_latency:
    ingest_e2e_p95_ms:          { op: lt, value: 2000, unit: ms }       # gen -> validated
    parquet_freshness_p95_s:    { op: lte, value: null, unit: s,
                                  note: "flush 間隔 + 60s。flush 間隔は PARQUET_FLUSH_INTERVAL から動的に算出" }

  E3_latest_value:
    latest_api_p95_ms:          { op: lt, value: 500, unit: ms, stretch: 20 }
    latest_freshness_p95_ms:    { op: lt, value: 2000, unit: ms }       # event -> hot 反映
    stale_latest_ratio:         { op: lt, value: 0.01, unit: ratio }

  E4_historical_query:
    warm_24h_1pt_p95_ms:        { op: lt, value: 2000, unit: ms }
    cold_7d_1pt_p95_ms:         { op: lt, value: 5000, unit: ms }
    agg_hour_cold_p95_ms:       { op: lt, value: 3000, unit: ms }
    agg_day_cache_hit_p95_ms:   { op: lt, value: 100, unit: ms }
    multipoint_scaling:         { op: lt, value: 1.0, note: "normalised per-point ratio mp_p95/(K*single_p95); < 1 = sublinear" }

  E5_pointlist_integrity:
    point_resolution_success:   { op: gte, value: 0.999, unit: ratio }  # 有効 frame
    unknown_point_rejection:    { op: eq, value: 1.0, unit: ratio }     # 受理ゼロ
    ownership_rejection:        { op: eq, value: 1.0, unit: ratio }
    remapping_correctness:      { op: eq, value: 1.0, unit: ratio }
    twin_lookup_p95_ms:         { op: lt, value: 50, unit: ms }

  E6_control_safety:
    command_success_rate:       { op: gte, value: 0.99, unit: ratio }   # 正常時
    command_rtt_p95_ms:         { op: lt, value: 2000, unit: ms }
    stale_replay_count:         { op: eq, value: 0, unit: count }       # ヘッドライン
    duplicate_write_count:      { op: eq, value: 0, unit: count }
    not_writable_rejection:     { op: eq, value: 1.0, unit: ratio }
    offline_503_ratio:          { op: eq, value: 1.0, unit: ratio }
    typed_failure_classified:   { op: eq, value: 1.0, unit: ratio }

  E7_storage_cost:
    parquet_bytes_per_row_ratio: { op: lte, value: 0.20, unit: ratio }  # vs timescale 非圧縮
    objects_per_building_hour:   { op: lte, value: 2, unit: count }      # compaction 後
    monthly_cost_estimate_usd:   { op: report, note: "DB 構成 vs Object Storage 構成を併記" }

  E8_resilience:
    data_loss_under_outage:     { op: lte, value: 0.01, unit: ratio }   # 復旧後
    rto_seconds:                { op: report, unit: s }
    backlog_drain_seconds:      { op: report, unit: s }
    graceful_degradation:       { op: report, note: "Hot/Warm/Cold 部分障害時の代替経路可否" }

  # E10: 長時間ソーク（#297 follow-up）。run-all.sh の既定 ONLY には含めない（数時間かかるため）—
  # `ONLY=E10 bash e2e/runner/run-axis.sh E10` または s19_endurance_soak.sh を個別実行する。
  # メモリ増加量そのものはまだ安全域が未確定のため report（情報値）。gate するのは #297 が求めた
  # 明確な二値の不変条件（再起動ゼロ・OOMゼロ・データ整合・health probe 成立）のみ。
  E10_endurance_soak:
    restart_count_total:        { op: eq, value: 0, unit: count }
    oom_count_total:            { op: eq, value: 0, unit: count }
    data_loss_ratio:            { op: lte, value: 0.01, unit: ratio }
    duplicate_rate:             { op: lte, value: 0.005, unit: ratio }
    health_probe_success_rate:  { op: gte, value: 0.999, unit: ratio }
    pending_stable:             { op: eq, value: 1, unit: bool }
    connector_worker_rss_growth_mib_per_hour: { op: report, unit: "MiB/h" }
    connector_worker_rss_max_mib:             { op: report, unit: MiB }
    nats_rss_growth_mib_per_hour:             { op: report, unit: "MiB/h" }
    nats_rss_max_mib:                         { op: report, unit: MiB }
    # #370 A/B の独立変数の**実測値**。chunk_seconds: 0（単一ストリーム指定）でも途中で失敗すれば
    # 張り直しているので、設定値ではなく実際に張った本数を見る。
    chunk_count:                              { op: report, unit: count, note: "実際に張った gRPC ストリーム本数" }
    # #370 の調査は 24h × 2 本で決着した（#370 のコメント / E10 シナリオ文書「実施記録」）。
    # 増加は Server GC の gen0 予算拡大で、リークではない。したがって閾値は「RSS がどれだけ増えたか」
    # ではなく「**滞留しているか**」に置く（#297）。
    #
    # RSS 増加率に閾値を置かないのは意図的である。増加の実体が gen0 予算の拡大である以上、その値は
    # GC が見た利用可能メモリに依存する — ホストのメモリ量・同居プロセス・cgroup limit で変わる数字を
    # gate にすると、環境が変わるたびに合わなくなる。RSS は report のまま残す（記録としては要る）。
    #
    # 下の 4 つが「リークの検出器」。いずれも 24h × 2 本の実測に対して十分な余裕を取ってある:
    #   gen2        実測 +0.01 / -0.06 → 0.5。gen2 は 24h・53 万フレームで 3 MiB 前後に留まった。
    #               0.5 MiB/h は 72h で +36 MiB、その水準に対して明確に異常。
    #   LOH         実測 -0.31 / -0.40（微減）→ 0.5。同上。
    #   RSS-committed  実測 -0.17 / +0.97 → 3.0。native / page cache 側の増加。+0.97 に対する余裕を
    #               取りつつ、72h で +216 MiB は説明を要する、という水準。
    #   thread pool 実測 0.00 / +0.01 → 0.5。スレッドリークは緩やかな単調増加として出る。
    #
    # **2 本の run から引いた暫定値である。** 上振れの再現があれば緩めるのではなく、まず何が滞留して
    # いるかを見ること — この 4 つはいずれも「増えていたら理由が要る」量であって、環境差で動く量ではない。
    #
    # これらは s19 に --prometheus を渡した run だけが値を出す。未指定なら metric 自体が存在せず、
    # gate は FAIL ではなく SKIP になる（gate.py: absent → SKIP）ので、短時間の反復 run は落ちない。
    connector_worker_gc_heap_gen2_mib_growth_per_hour:        { op: lte, value: 0.5, unit: "MiB/h", note: "gen2 の滞留。オブジェクトが解放されていない場合ここに出る" }
    connector_worker_gc_heap_loh_mib_growth_per_hour:         { op: lte, value: 0.5, unit: "MiB/h", note: "LOH の滞留（#297 の名指し調査項目）" }
    connector_worker_rss_minus_gc_committed_growth_mib_per_hour: { op: lte, value: 3.0, unit: "MiB/h", note: "native / page cache 側の増加。GC では説明できない分" }
    connector_worker_thread_pool_thread_count_growth_per_hour: { op: lte, value: 0.5, unit: "count/h", note: "thread pool スレッド数の後半スロープ（専用スレッドは含まないので、横ばい＝スレッド不増とは読めない）" }
    connector_worker_gc_heap_size_mib_growth_per_hour:        { op: report, unit: "MiB/h", note: "GC heap（全世代 + LOH/POH）の後半スロープ。gen0 を含むので値そのものは振れる — 判定には使わない" }
    connector_worker_gc_committed_mib_growth_per_hour:        { op: report, unit: "MiB/h", note: "GC が commit している総量（= 直近 GC 時点の値）の後半スロープ" }
    connector_worker_gc_heap_gen0_mib_growth_per_hour:        { op: report, unit: "MiB/h", note: "gen0 = nursery の予算。24h A/B で増加の主因と判明したが、GC の裁量なので閾値は置かない" }
    connector_worker_gc_collections_growth_per_hour:          { op: report, unit: "count/h", note: "GC 発生頻度。gc_committed の鮮度＝判別指標の品質を示す（低いほど subtrahend が古い）" }
    # 判別指標: RSS − GC committed。RSS が伸びてこれが横ばい = managed heap の伸び、
    # これも伸びる = native / page cache / GC が OS に返していない領域。
    connector_worker_rss_minus_gc_committed_mib_start:        { op: report, unit: MiB }
    connector_worker_rss_minus_gc_committed_mib_end:          { op: report, unit: MiB }
    # カバレッジ。判別指標は「RSS スロープ」と「差分スロープ」の比較で読むが、Prometheus の
    # カバレッジが部分的だと両者が違う時間帯を指す。_samples と _paired（差分と同じ tick 集合だけで
    # 測った RSS スロープ）を併せて見て、比較の両辺が同じ窓かを確認すること。
    connector_worker_rss_minus_gc_committed_samples:          { op: report, unit: count, note: "差分を計算できた tick 数（RSS と GC committed が揃った tick）" }
    connector_worker_rss_samples:                             { op: report, unit: count, note: "RSS サンプル総数。上の値との差がそのまま Prometheus 側の欠測" }
    connector_worker_rss_growth_mib_per_hour_paired:          { op: report, unit: "MiB/h", note: "差分と同一 tick 集合で測った RSS スロープ（比較の両辺を揃えるため）" }

  # E11: 大規模継続負荷下の Parquet 保存・compaction・保持期間（#263, #261/#297 follow-up）。
  # run-all.sh の既定 ONLY には含めない（E10 と同じ理由）— `ONLY=E11 bash e2e/runner/run-axis.sh E11`
  # または s20_retention_compaction.sh を個別実行する。capped-run（10 分未満）が証明できること／
  # できないことの詳細は scenarios/E11-lake-retention-scale.md 参照 — 保持境界の分類ロジックは
  # ここで gate するが、実際の複数日保持ウィンドウでの失効そのものは capped-run のスコープ外。
  E11_lake_retention_scale:
    flush_success_rate:         { op: gte, value: 0.99, unit: ratio }
    flush_latency_p95_ms:       { op: lte, value: null, unit: ms,
                                  note: "flush 間隔 + マージン。flush 間隔は PARQUET_FLUSH_INTERVAL から動的に算出（dynamic のため SKIP）" }
    compaction_success_rate:    { op: gte, value: 0.99, unit: ratio }
    compaction_latency_p95_ms:  { op: lte, value: null, unit: ms,
                                  note: "compaction 間隔 + マージン。間隔は LAKE_COMPACTION_INTERVAL から動的に算出（dynamic のため SKIP）" }
    # 「すでに settled な時間」への合成配置により、実際に書かれた object の実測 age に対する
    # 分類ロジック自体の回帰ガード。完全一致（== 1.0）を要求 — 短時間 run では常にこの値になり
    # うるが、境界越えの実証ではなく分類パイプラインの正しさの担保として置く（scenario 参照）。
    retention_boundary_correct_ratio: { op: eq, value: 1.0, unit: ratio }
    objects_per_building_hour:  { op: lte, value: 2, unit: count }      # E7 と同じ KPI（compaction 後）
    data_loss_ratio:            { op: lte, value: 0.01, unit: ratio }   # E1 と同じ値を再利用
    duplicate_rate:              { op: lte, value: 0.005, unit: ratio } # E1 と同じ値を再利用
    restart_count_total:        { op: eq, value: 0, unit: count }
    oom_count_total:            { op: eq, value: 0, unit: count }
    health_probe_success_rate:  { op: gte, value: 0.999, unit: ratio }
    flush_count:                 { op: report, unit: count }
    compaction_count:            { op: report, unit: count }
    retention_boundary_expired_but_present:  { op: report, unit: count, note: "0 のはずのリーク検出（分類上、期限切れなのに残存）" }
    retention_boundary_retained_but_missing: { op: report, unit: count, note: "0 のはずの早期消失検出（分類上、期限内なのに消失）" }
    retention_ilm_rule_applied:  { op: report, unit: bool, note: "LAKE_RETENTION_DAYS の ILM ルールが実際に MinIO に適用されているかの確認（#263 の public storage contract ギャップ）。mc の応答が解釈できない場合は SKIP（未適用と誤判定しない）" }
    retention_ilm_days_configured: { op: report, unit: days }

  # E12: 混在負荷ベンチマーク（#401, #399 子②）。compaction 中/非中で分けた ingress p95/p99 と、
  # telemetry 負荷あり/なしでの control RTT を比較し、role 分割（WORKER_ROLE, docker-compose.roles.yaml）
  # の要否を #399 の 6 条件（測定可能な 1-4 のみ）に対して判定する。run-all.sh の既定 ONLY には含めない
  # （E10/E11 と同じ理由 — 数分かかる）— `ONLY=E12 bash e2e/runner/run-axis.sh E12` または
  # s21_mixed_load_benchmark.sh を個別実行する。クライアント/サーバ同一ホストの交絡は
  # scenarios/E12-mixed-load-benchmark.md に明記（worker-role-split-measurement.md と同じ限界）。
  E12_mixed_load_benchmark:
    # 本軸の核心測定（#399 条件 2）。compaction 中/非中の ingress p95・p99 の比率。しきい値は
    # 「明確な劣化」の目安として 1.5 倍（非中の 1.5 倍を超えたら劣化ありと見る）。
    ingest_e2e_compaction_p95_degradation_ratio: { op: lte, value: 1.5, unit: ratio,
      note: "compaction 中 p95 ÷ 非中 p95。両バケットにサンプルが無ければ SKIP" }
    ingest_e2e_compaction_p99_degradation_ratio: { op: lte, value: 1.5, unit: ratio,
      note: "compaction 中 p99 ÷ 非中 p99" }
    ingest_e2e_during_compaction_p50_ms:        { op: report, unit: ms }
    ingest_e2e_during_compaction_p95_ms:        { op: report, unit: ms }
    ingest_e2e_during_compaction_p99_ms:        { op: report, unit: ms }
    ingest_e2e_during_compaction_samples:       { op: report, unit: count }
    ingest_e2e_not_during_compaction_p50_ms:    { op: report, unit: ms }
    ingest_e2e_not_during_compaction_p95_ms:    { op: report, unit: ms }
    ingest_e2e_not_during_compaction_p99_ms:    { op: report, unit: ms }
    ingest_e2e_not_during_compaction_samples:   { op: report, unit: count }
    # #399 条件 4。telemetry 負荷ありでの control RTT が、無負荷の何倍まで許容できるかの単一ゲート
    # （p95）。p99 は参考値として report のみに留める。
    control_rtt_p95_degradation_ratio:          { op: lte, value: 1.5, unit: ratio,
      note: "並行 telemetry 負荷あり p95 ÷ 無負荷 p95。両側にサンプルが無ければ SKIP" }
    control_rtt_p99_degradation_ratio:          { op: report, unit: ratio }
    control_rtt_baseline_p50_ms:                { op: report, unit: ms }
    control_rtt_baseline_p95_ms:                { op: report, unit: ms }
    control_rtt_baseline_p99_ms:                { op: report, unit: ms }
    control_rtt_baseline_samples:               { op: report, unit: count }
    control_rtt_concurrent_p50_ms:              { op: report, unit: ms }
    control_rtt_concurrent_p95_ms:              { op: report, unit: ms }
    control_rtt_concurrent_p99_ms:              { op: report, unit: ms }
    control_rtt_concurrent_samples:              { op: report, unit: count }
    # #399 条件 1・3 の裏付け系列（GC ではなく CPU/JetStream writer lag だが、E10 の GC/lag 系列と
    # 同じ「情報値として記録、gate は不変条件のみ」という置き方を踏襲）。
    ingest_cpu_high_ratio:                       { op: report, unit: ratio,
      note: "ingest ロール CPU が --ingest-cpu-threshold-pct（既定65%）以上だったサンプルの割合" }
    ingest_cpu_samples:                          { op: report, unit: count }
    consumer_pending_slope_per_sec:               { op: report, unit: "count/s",
      note: "JetStream BUILDING_OS_VALIDATED consumer pending（writer lag）の後半回帰スロープ。#399 条件3" }
    consumer_pending_max:                         { op: report, unit: count }
    compaction_converged:                         { op: report, unit: bool }
    compaction_converged_at_s:                     { op: report, unit: s }
    # 不変条件（E10/E11 と同じ）。role 分割で 2〜3 プロセスに増えても壊れていないことの最低保証。
    restart_count_total:                          { op: eq, value: 0, unit: count }
    oom_count_total:                              { op: eq, value: 0, unit: count }
    # #399 の判定結果そのもの。0/1 の bool を report として残す — 単一 run の判定は補助情報であり、
    # 「分割すべき」を機械的に FAIL/PASS へ倒すものではない（#399 条件 5・6 は本軸で測定不能なため）。
    split_decision_split_recommended:             { op: report, unit: bool,
      note: "#399 条件1-4のみの判定（5-6 は not_applicable_from_this_run）。kpi-summary.json の split_decision.split_recommended をそのまま報告" }
    split_decision_measurable_conditions_met:     { op: report, unit: count }
    split_decision_measurable_conditions_evaluated: { op: report, unit: count }

  # E9: 運用者ユーザビリティ（#159）。web-client の Playwright(route-mock)ハーネスが計測して
  # {axis:E9_operator_usability, metrics} を run ディレクトリに出力し、この gate が採点する。
  # docker 不要の route-mock サブセット。実ログイン/実制御まで含む計測はフルスタック E2E（別軸）。
  E9_operator_usability:
    axe_critical_violations:    { op: eq,  value: 0, unit: count }      # WCAG2 A/AA 重大（axe-core）
    axe_serious_violations:     { op: lte, value: 0, unit: count }      # WCAG2 A/AA 深刻
    time_to_sample_seconds:     { op: lte, value: 5, unit: s }          # ポイント表示 → 最新値が可視になるまで
    login_to_point_clicks:      { op: report, unit: count, note: "ログイン後、主要ポイントの値到達までのクリック数" }
    keyboard_first_focusable:   { op: report, unit: bool, note: "Tab で最初の操作要素にフォーカスできるか（1/0）" }

# 論文ヘッドライン 5 指標（強調表示用）
headline:
  - E2_ingest_latency.ingest_e2e_p95_ms
  - E3_latest_value.latest_api_p95_ms
  - E4_historical_query.warm_24h_1pt_p95_ms
  - E5_pointlist_integrity.point_resolution_success
  - E6_control_safety.stale_replay_count

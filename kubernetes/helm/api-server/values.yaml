replicaCount: 1

image:
  repository: ghcr.io/gutp/building-os-api-server
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

env:
  ASPNETCORE_ENVIRONMENT: Production
  PORT: "8080"

# Injected by OpenTofu or CI as a K8s Secret reference
secretName: api-server-env

keycloak:
  realm: building-os
  clientId: ""
  issuerUri: ""

timescaledb:
  host: timescaledb.building-os.svc.cluster.local
  port: 5432
  database: building_os

oxigraph:
  endpoint: http://oxigraph.building-os.svc.cluster.local:7878

nats:
  url: nats://nats.building-os.svc.cluster.local:4222

# General (non-mTLS) Traefik IngressRoute for the API Server host. Requires the Traefik CRDs.
ingress:
  enabled: false
  host: api.buildingos.local
  tls:
    enabled: false
    secretName: api-server-tls
  # #521: trusted gateway identity header. Always stripped on this route by the
  # `<release>-api-server-strip-gateway-id` Middleware — only the mTLS ingress may set it (from the
  # client cert). Must match the API Server resolver (GatewayIdentityDefaults.TrustedHeaderName) and
  # the ConnectorWorker GRPC_INGRESS_GATEWAY_ID_HEADER — change all of them together.
  gatewayIdHeader: X-Gateway-Id

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3

# Warm-tier storage mode (#216): "parquet" (default) or "timescale".
warmStore: parquet

# Credentials for a private image registry. Required when `image.repository`
# points at a registry that needs authentication — GHCR packages owned by an
# organization are private by default, so a deployment pulling from
# ghcr.io/<org>/... needs a docker-registry secret named here. Empty means the
# node's own credentials (or a public registry) are enough.
imagePullSecrets: []

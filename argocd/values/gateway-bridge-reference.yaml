# ArgoCD Helm values for gateway-bridge — reference environment.
replicaCount: 2

image:
  repository: ghcr.io/gutp-bim/buildingos-gateway-bridge
  tag: sha-59b9cc1
  pullPolicy: IfNotPresent

# Credentials for pulling from the registry above. GHCR packages owned by an
# organization are private by default, so a cluster pulling ghcr.io/gutp-bim/...
# needs a docker-registry secret and its name listed here. Left empty because the
# secret is environment-specific and must not be committed:
#   kubectl -n building-os create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=<user> --docker-password=<PAT>
imagePullSecrets: []


service:
  type: ClusterIP
  port: 8080

nats:
  url: nats://nats.building-os.svc.cluster.local:4222

otel:
  endpoint: http://otel-collector.building-os.svc.cluster.local:4317
  serviceName: building-os-gateway-bridge

autoscaling:
  enabled: false

# North-south gRPC ingress for external BOWS — enable + fill host/cert refs after the infra
# review (Envoy-vs-Traefik, cert-manager issuer). HITL: verify on-cluster.
ingress:
  enabled: false
  host: gateway-bridge.example.com
  mtls:
    enabled: false
    certManager:
      enabled: false
      issuerRef:
        name: building-os-ca-issuer
        kind: ClusterIssuer

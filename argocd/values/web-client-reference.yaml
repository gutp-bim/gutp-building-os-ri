# ArgoCD Helm values for web-client — reference environment.
replicaCount: 2

image:
  repository: ghcr.io/gutp-bim/buildingos-web-client
  tag: main # bootstrap only — CI rewrites this to sha-<short-sha> after each build
  pullPolicy: IfNotPresent

# Credentials for pulling from the registry above. GHCR packages owned by an
# organization are private by default, so a cluster pulling ghcr.io/gutp-bim/...
# needs a docker-registry secret and its name listed here. Left empty because the
# secret is environment-specific and must not be committed:
#   kubectl -n building-os create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=<user> --docker-password=<PAT>
imagePullSecrets: []


env:
  NEXT_PUBLIC_KEYCLOAK_AUTHORITY: https://keycloak.example.com/realms/building-os
  NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: web-client
  NEXT_PUBLIC_API_BASE_URL: https://api.example.com

ingress:
  enabled: true
  host: app.example.com

# Argo CD Helm values overlay — example environment ("reference").
# This is a REFERENCE CONFIGURATION for an on-premises Kubernetes deployment,
# kept in this repo only as a working sample (#17): production environment
# values are recommended to live in a dedicated GitOps repository. Start your
# own environment from argocd/values/example.yaml and point the
# argocd-image-update workflow at it via the ARGOCD_VALUES_FILE repository
# variable. Domain names (*.example.com) and image tags are
# site-specific; the tag is rewritten by CI on every main merge.
# Referenced by argocd/apps/reference.yaml.

replicaCount: 1

image:
  repository: ghcr.io/gutp-bim/buildingos-api-server
  tag: sha-43699d8
  pullPolicy: IfNotPresent

# Credentials for pulling from the registry above. GHCR packages owned by an
# organization are private by default, so a cluster pulling ghcr.io/gutp-bim/...
# needs a docker-registry secret and its name listed here. Left empty because the
# secret is environment-specific and must not be committed:
#   kubectl -n building-os create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=<user> --docker-password=<PAT>
imagePullSecrets: []


service:
  type: ClusterIP
  port: 80
  targetPort: 8080

secretName: api-server-env

keycloak:
  realm: building-os
  clientId: api-server
  issuerUri: https://keycloak.example.com/realms/building-os

oxigraph:
  endpoint: http://oxigraph.building-os.svc.cluster.local:7878

nats:
  url: nats://nats.building-os.svc.cluster.local:4222

ingress:
  enabled: true
  host: api.example.com

autoscaling:
  enabled: false

# ArgoCD Helm values for connector-worker — reference environment.
replicaCount: 1

# Capability role (#400): all|ingest|lake|control. `replicaCount` must stay 1 while this is
# all or lake (twin seed / compaction / retention have no cross-replica exclusion).
workerRole: all

image:
  repository: ghcr.io/gutp-bim/buildingos-connector-worker
  tag: sha-496040a
  pullPolicy: IfNotPresent

# Credentials for pulling from the registry above. GHCR packages owned by an
# organization are private by default, so a cluster pulling ghcr.io/gutp-bim/...
# needs a docker-registry secret and its name listed here. Left empty because the
# secret is environment-specific and must not be committed:
#   kubectl -n building-os create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=<user> --docker-password=<PAT>
imagePullSecrets: []


nats:
  url: nats://nats.building-os.svc.cluster.local:4222

oxigraph:
  endpoint: http://oxigraph.building-os.svc.cluster.local:7878

minio:
  endpoint: http://minio.building-os.svc.cluster.local:9000

secretName: connector-worker-env

autoscaling:
  enabled: false

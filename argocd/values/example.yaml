# Argo CD Helm values overlay — GENERALIZED TEMPLATE (#17).
#
# Copy this file to argocd/values/<your-env>.yaml, replace every
# <angle-bracket> placeholder, and point an Argo CD Application at it
# (see argocd/apps/ for the reference app manifests).
#
# Notes:
# - `image.tag` is managed by CI: the argocd-image-update workflow rewrites it to
#   `sha-<short-sha>` — the same tag harbor-push publishes — after a SUCCESSFUL
#   build, and only for the services that build actually produced. Point CI at
#   your own overlays with the ARGOCD_VALUES_MAP repository variable, holding
#   `service=path` pairs (api-server / connector-worker / gateway-bridge /
#   web-client).
# - The reference*.yaml files alongside this template are a REFERENCE
#   environment kept in this repo as a working sample; production environment
#   values are recommended to live in a dedicated GitOps repository long-term.

replicaCount: 1

image:
  # The bundled reference overlays pull from this project's own GHCR packages
  # (ghcr.io/gutp-bim/buildingos-<service>), which is where harbor-push publishes.
  repository: <your-registry>/buildingos-api-server
  tag: main # bootstrap only — CI rewrites this to sha-<short-sha> after each build
  pullPolicy: IfNotPresent

# Needed when the registry above requires credentials. GHCR packages owned by an
# organization are private by default, so a cluster pulling ghcr.io/<org>/... needs
# a docker-registry secret named here.
imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

secretName: api-server-env

keycloak:
  realm: building-os
  clientId: api-server
  issuerUri: https://<your-keycloak-host>/realms/building-os

oxigraph:
  endpoint: http://oxigraph.building-os.svc.cluster.local:7878

nats:
  url: nats://nats.building-os.svc.cluster.local:4222

ingress:
  enabled: true
  host: <your-api-host>

autoscaling:
  enabled: false

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: connector-worker-reference
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.slack: "building-os-alerts"
spec:
  project: default

  source:
    repoURL: https://github.com/gutp-bim/gutp-building-os-ri.git
    targetRevision: HEAD
    path: kubernetes/helm/connector-worker
    helm:
      valueFiles:
        - ../../argocd/values/connector-worker-reference.yaml
      values: |
        image:
          repository: harbor.example.com/building-os/building-os-connector-worker

  destination:
    server: https://kubernetes.default.svc
    namespace: building-os

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 5

# ── customTags ──────────────────────────────────────────────────────────────
# Selectors decide at GENERATION time which points carry a tag; only the tag key lands in the twin
# (sbco:customTags, value true). Per the tagging guideline (#454 / 横断 D), tags carry operational
# meaning — never structure such as "floor=3F", which the twin already models.
# Selector fields (all optional, ANDed): floor, equipment, template (list), everyNth (the n-th,
# 2n-th, … instance of the equipment type on each floor).
[[tags]]
key = "critical"
equipment = "ahu"
template = ["supply_temp"]

[[tags]]
key = "tenant-a"
floor = "2F"

[[tags]]
key = "energy-saving-target"
template = ["active_power", "energy", "power"]

[[tags]]
key = "maintenance-required"
equipment = "fcu"
everyNth = 5

# ── Degraded scenario (DEMO_SCENARIO=degraded, the `make demo` default) ──────
# Points are picked with a seeded RNG from the sorted candidate list, so the same ids every time.
[scenario]
# Gateways the feeder never opens an egress stream for and never streams telemetry from:
# their points are missing with reason gateway_disconnected (ADR-0004 connection axis).
disconnectedGateways = ["GW-DEMO-RF"]

# Stale: one reading back-dated to now − interval × 4, then silence → over the interval × 3 threshold
# from the first second. Short-interval templates make the threshold breach easy to read.
[scenario.stale]
count = 18
templates = ["fan_status", "zone_temp", "room_temp"]

# Missing (never received): nothing is ever sent. Together with the disconnected gateway's points.
[scenario.missing]
count = 3
templates = ["co2", "room_humidity"]

# Alarm: streamed on its interval, but at a value past alarmHigh.
[scenario.alarm]
count = 2
templates = ["supply_temp"]
value = 33.5

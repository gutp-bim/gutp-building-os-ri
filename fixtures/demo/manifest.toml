# =============================================================================
# Demo dataset manifest (#458) — 東京デモビル
# =============================================================================
# The ONLY hand-maintained file in fixtures/demo/. Everything else here is generated from it:
#
#   python3 Tools/demo-fixture-generator/generate.py
#
#   twin.ttl          digital-twin seed (demo building + the fixtures/e2e/twin.ttl building verbatim,
#                     so the existing GW-SOS-001 / SOS-PT-001..008 control demo keeps working)
#   pointlist.csv     the demo building's point list (smart-building standard 30-column CSV)
#   feeder-plan.json  what the demo feeder streams per point, and which points the `degraded`
#                     scenario makes stale / missing / alarming
#
# Generation is deterministic (fixed `seed`, sorted iteration): two runs produce byte-identical
# files, and CI (pr-check "Demo Fixture Check") fails if the committed output drifts from this file.
# Do not edit the generated files by hand.
# =============================================================================

seed = 458

[site]
id = "site-demo"
name = "Demo Site"

[building]
id = "bldg-demo"
name = "東京デモビル"
# Prefix for every generated id (rooms, devices, points, gateways) — keeps sbco:id globally unique
# across the twin (#517) and clear of the e2e building's ids.
idPrefix = "DEMO"

# One gateway per floor (GW-DEMO-<floor>). RF holds a small weather station on its own gateway so
# the degraded scenario can take one gateway down without blacking out a whole floor.
[[floors]]
name = "1F"
rooms = 8
equipment = { ahu = 2, vav = 25, fcu = 15, envSensor = 64, powerMeter = 10 }

[[floors]]
name = "2F"
rooms = 8
equipment = { ahu = 2, vav = 25, fcu = 15, envSensor = 64, powerMeter = 10 }

[[floors]]
name = "3F"
rooms = 8
equipment = { ahu = 2, vav = 25, fcu = 15, envSensor = 64, powerMeter = 10 }

[[floors]]
name = "RF"
rooms = 0
equipment = { weatherStation = 1 }

# ── Equipment types ─────────────────────────────────────────────────────────
# placement: "room" = round-robin over the floor's rooms; "machineRoom" = the floor's machine room
# (<floor>-MR, created when any equipment asks for it); "level" = sbco:locatedIn the Level directly.
# Plant equipment goes in a machine room rather than straight on the Level because /home's attention
# list walks floor → rooms → devices and does not see Level-placed equipment yet (#544).
[equipmentTypes.ahu]
code = "AHU"
deviceType = "AHU"
name = "空調機"
placement = "machineRoom"
points = ["supply_temp", "return_temp", "supply_temp_sp", "supply_humidity", "return_co2",
          "fan_status", "fan_speed", "damper_pos", "filter_dp", "valve_pos", "fault_status", "power"]

[equipmentTypes.vav]
code = "VAV"
deviceType = "VAV"
name = "VAV"
placement = "room"
points = ["zone_temp", "zone_temp_sp", "airflow", "damper_pos"]

[equipmentTypes.fcu]
code = "FCU"
deviceType = "FCU"
name = "ファンコイル"
placement = "room"
points = ["zone_temp", "fan_status", "fan_speed", "valve_pos"]

[equipmentTypes.envSensor]
code = "ENV"
deviceType = "Sensor"
name = "環境センサー"
placement = "room"
points = ["room_temp", "room_humidity", "co2"]

[equipmentTypes.powerMeter]
code = "PM"
deviceType = "PowerMeter"
name = "電力量計"
placement = "machineRoom"
points = ["active_power", "energy"]

[equipmentTypes.weatherStation]
code = "WS"
deviceType = "WeatherStation"
name = "気象観測"
placement = "machineRoom"
points = ["outdoor_temp", "outdoor_humidity"]

# ── Point templates ─────────────────────────────────────────────────────────
# kind: number | boolean | enum (the ingress contract is numeric, so boolean/enum stream as codes).
# base/amplitude/period shape the feeder's sine; lo/hi clamp numbers and bound enum codes.
# alarmHigh/alarmLow/warnHigh/warnLow → bos:* (ADR-0005). minValue/maxValue/enumLabels → control schema.
[pointTemplates.supply_temp]
code = "SAT"
name = "給気温度"
pointType = "Temperature"
spec = "Measurement"
unit = "degC"
interval = 60
kind = "number"
base = 16.0
amplitude = 1.5
period = 900
alarmHigh = 30
warnHigh = 26
alarmLow = 10

[pointTemplates.return_temp]
code = "RAT"
name = "還気温度"
pointType = "Temperature"
spec = "Measurement"
unit = "degC"
interval = 60
kind = "number"
base = 25.0
amplitude = 1.0
period = 1200

[pointTemplates.supply_temp_sp]
code = "SATSP"
name = "給気温度設定"
pointType = "Setpoint"
spec = "Setpoint"
unit = "degC"
interval = 300
kind = "number"
base = 16.0
amplitude = 0.0
period = 3600
writable = true
minValue = 12
maxValue = 28

[pointTemplates.supply_humidity]
code = "SAH"
name = "給気湿度"
pointType = "Humidity"
spec = "Measurement"
unit = "%"
interval = 60
kind = "number"
base = 50.0
amplitude = 5.0
period = 1500

[pointTemplates.return_co2]

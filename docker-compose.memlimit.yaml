# Caps the Connector Worker's memory, for the E10 soak variant that asks "does it survive under a
# limit" rather than "how large does it grow" (#297).
#
#   CONNECTOR_WORKER_MEM_LIMIT=768m \
#     docker compose -f docker-compose.oss.yaml -f docker-compose.memlimit.yaml up -d ...
#
# Or, which is what you normally want, let the soak wire it up:
#
#   MEM_LIMIT=768m DURATION_HOURS=6 bash Tools/e2e-performance/s19_endurance_soak.sh <out-dir>
#
# WHY A LIMIT IS THE RIGHT QUESTION NOW
#
# The 24h A/B settled what the growth is: Server GC widening the gen0 budget, not a leak — gen2 sat
# at ~3 MiB across 24h and 530k frames while RSS reached ~592 MiB. The GC sizes that budget from the
# memory it believes it has, so "how much RSS does it reach" is a property of the host, not of the
# software, and measuring it for longer on one machine produces a number that does not transfer.
#
# What does transfer is the behaviour under a cap: .NET reads the cgroup limit and sizes its heaps
# against it, so a capped run answers the question an operator actually has — what do I put in the
# Helm values. That is a few hours per limit rather than the multi-day run an uncapped soak needs to
# say anything.
#
# Deliberately only the connector worker. It is the subject; capping its dependencies would change
# what is being measured, which is the same reason nexus-gateway's soak overlay sets no limits at
# all while it is asking the uncapped question (see its docs/soak-testing.md).
#
# READING THE RESULT
#
# No new metric is needed to read the result. `oom_count_total` and `restart_count_total` are gated
# at 0, so if the process cannot live within the cap, the run fails on its own.
#
# Beyond that, watch `connector_worker_gc_collections_growth_per_hour`. A smaller nursery means
# collecting more often, so the cost of a tighter cap shows up as GC frequency; `data_loss_ratio`
# and `pending_stable` then say whether that cost reached the data path.
services:
  building-os.connector-worker:
    mem_limit: ${CONNECTOR_WORKER_MEM_LIMIT:-1g}

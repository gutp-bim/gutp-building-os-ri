name: Argo CD Image Update

# Rewrites the image tag in the Argo CD values overlays after images are built,
# and commits back so Argo CD picks the change up.
#
# This workflow must never move a tag that no image carries. What it must NOT do is
# trust the trigger to guarantee that: it looks the build up and checks it.
#
# The `workflow_run` trigger alone is not enough. In this repository it has never
# once fired: across 30 consecutive successful harbor-push runs, every single
# argocd-image-update run was `event=push`, and removing the push trigger left the
# chain completely dead. So both triggers are declared, and the job resolves and
# verifies the harbor-push run for the target commit itself — which is the check
# that actually matters. Under `push` that means waiting for the build to finish.
#
# The original defect (#306) was not the push trigger as such; it was that nothing
# verified the build before advancing the tag, which let 88 commits move tags during
# a month when harbor-push could not even start.

on:
  workflow_run:
    workflows: ["Harbor Dual Push (GHCR + Harbor)"]
    types:
      - completed
  push:
    branches:
      - main

concurrency:
  group: argocd-image-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-image-tags:
    runs-on: ubuntu-latest
    # No trigger-level guard: whether the build succeeded is established below by
    # looking the run up, which works the same for both triggers. Under workflow_run
    # the branch still has to be main — harbor-push also runs for v*.*.* tags and for
    # manual dispatches from feature branches.
    if: >-
      github.event_name == 'push' ||
      github.event.workflow_run.head_branch == 'main'

    permissions:
      contents: write
      actions: read # resolve the harbor-push run for this commit and read its jobs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the build for this commit
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOT github.sha under workflow_run: there it is the default branch tip at
          # dispatch time, which is not necessarily the commit the images were built
          # from. head_sha is.
          TARGET_SHA: ${{ github.event_name == 'push' && github.sha || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Wait for harbor-push on this exact commit. Under the push trigger this
          # workflow starts alongside the build, so without waiting it would decide
          # before there is anything to decide on — the failure mode #306 is about.
          deadline=$(( SECONDS + 2400 ))
          conclusion=""
          run_id=""
          while :; do
            run_json=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/harbor-push.yml/runs?head_sha=${TARGET_SHA}&per_page=1" \
              --jq '.workflow_runs[0] // empty')

            if [ -n "$run_json" ]; then
              run_id=$(jq -r '.id' <<<"$run_json")
              status=$(jq -r '.status' <<<"$run_json")
              conclusion=$(jq -r '.conclusion // ""' <<<"$run_json")
              [ "$status" = "completed" ] && break
              echo "harbor-push run ${run_id} is ${status}; waiting"
            else
              # A commit that skipped CI (the bot's own tag commits do) never starts a
              # build, so there is nothing to wait for and nothing to update.
              echo "No harbor-push run for ${TARGET_SHA}"
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::notice::gave up waiting for a harbor-push run on ${TARGET_SHA}; leaving tags untouched"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done

          if [ "$conclusion" != "success" ]; then
            echo "::notice::harbor-push run ${run_id} concluded '${conclusion}' — leaving tags untouched"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The tag must match what harbor-push publishes. docker/metadata-action's
          # `type=sha,prefix=sha-` emits the 7-character short SHA. The previous
          # `${GITHUB_SHA::8}` was wrong three ways at once — no prefix, eight
          # characters, and under workflow_run the wrong commit (#306).
          {
            echo "proceed=true"
            echo "run_id=${run_id}"
            echo "tag=sha-${TARGET_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Collect the services that were actually built
        id: built
        if: steps.build.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.build.outputs.run_id }}
        run: |
          set -euo pipefail
          # harbor-push builds only the images whose sources changed, so bumping every
          # overlay to this SHA would point the untouched ones at a tag that was never
          # pushed. The build matrix names each job "Build & Push (<name>)".
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "success") | .name' > jobs.txt

          sed -n 's/^Build & Push (\(.*\))$/\1/p' jobs.txt | sort -u > built.txt

          if [ ! -s built.txt ]; then
            echo "No image build jobs succeeded in run ${RUN_ID} — nothing to update."
          fi
          echo "Built: $(tr '\n' ' ' < built.txt)"
          { echo "services<<EOF"; cat built.txt; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Update the Argo CD values overlays
        if: steps.build.outputs.proceed == 'true'
        env:
          TAG: ${{ steps.build.outputs.tag }}
          SERVICES: ${{ steps.built.outputs.services }}
          # Retarget CI at another deployment's overlays (#17) with a repository
          # variable holding `service=path` pairs, comma or newline separated. The
          # default is the bundled reference environment. A service missing from the
          # map is skipped rather than guessed at.
          VALUES_MAP: >-
            ${{ vars.ARGOCD_VALUES_MAP ||
            'api-server=argocd/values/reference.yaml,
            connector-worker=argocd/values/connector-worker-reference.yaml,
            gateway-bridge=argocd/values/gateway-bridge-reference.yaml,
            web-client=argocd/values/web-client-reference.yaml' }}
        run: |
          set -euo pipefail

          printf '%s' "$VALUES_MAP" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | grep -v '^$' > map.txt

          while IFS= read -r service; do
            [ -n "$service" ] || continue
            file="$(sed -n "s|^${service}=||p" map.txt | head -1)"
            if [ -z "$file" ]; then
              echo "::notice::no values overlay mapped for '${service}' — skipping"
              continue
            fi
            if [ ! -f "$file" ]; then
              echo "::error::values overlay '${file}' mapped for '${service}' does not exist"
              exit 1
            fi
            # Anchored to the two-space indent under the top-level `image:` block so
            # a `tag:` nested anywhere else in the overlay is left alone.
            sed -i "s|^  tag: .*|  tag: ${TAG}|" "$file"
            echo "Updated ${file} → tag: ${TAG}"
          done <<< "$SERVICES"

      - name: Commit and push updated values
        if: steps.build.outputs.proceed == 'true'
        env:
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add argocd/values/

          if git diff --staged --quiet; then
            echo "No values changed — skipping commit"
            exit 0
          fi

          # [skip ci] keeps this commit from starting an idle cycle. GitHub Actions
          # honours it on push events (as it does [ci skip], [no ci], [skip actions]
          # and [actions skip]), and harbor-push triggers on every push to main.
          # Without it this commit would start a harbor-push run that builds nothing —
          # argocd/ is outside that workflow's DotNet/proto/web-client filters, so its
          # matrix comes out empty — and that run would still finish successfully and
          # re-trigger this one. The second pass finds no `Build & Push` jobs, updates
          # no overlay and commits nothing, so it stops there rather than looping;
          # [skip ci] just avoids the two idle runs.
          git commit -m "chore(argocd): update image tags to ${TAG} [skip ci]"
          git push origin HEAD:main

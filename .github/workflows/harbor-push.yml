name: Harbor Dual Push (GHCR + Harbor)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: harbor-push-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/buildingos

jobs:
  # ── Detect changed areas (A-4) ────────────────────────────────
  # Tag pushes (v*.*.*) always build everything, since a release tag isn't
  # necessarily on top of a diff against the previous commit on main.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      # The build matrix itself, not just the flags: an image is selected here rather than
      # filtered later. A job-level `if` cannot read `matrix` — that context does not exist until
      # after the job's condition has been evaluated — so the previous attempt to skip per image
      # that way made the whole workflow fail to load (#306).
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      # A release tag is not necessarily on top of a diff against the previous commit, and a manual
      # run is an explicit request to rebuild — both mean "build everything".
      - name: Force full build on tag push or manual run
        id: force
        run: |
          echo "force=${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            dotnet:
              - 'DotNet/**'
              - 'proto/**'
            web-client:
              - 'web-client/**'

      - name: Build the image matrix
        id: build-matrix
        env:
          DOTNET: ${{ steps.filter.outputs.dotnet == 'true' || steps.force.outputs.force == 'true' }}
          WEB: ${{ steps.filter.outputs['web-client'] == 'true' || steps.force.outputs.force == 'true' }}
        run: |
          matrix=$(jq -cn --argjson dotnet "$DOTNET" --argjson web "$WEB" '
            [
              {name: "api-server",       context: ".",          dockerfile: "DotNet/BuildingOS.ApiServer/Dockerfile",     group: "dotnet"},
              {name: "connector-worker", context: ".",          dockerfile: "DotNet/BuildingOS.ConnectorWorker/Dockerfile", group: "dotnet"},
              {name: "gateway-bridge",   context: ".",          dockerfile: "DotNet/BuildingOS.GatewayBridge/Dockerfile",  group: "dotnet"},
              {name: "web-client",       context: "web-client", dockerfile: "web-client/Dockerfile",                       group: "web"}
            ]
            | map(select((.group == "dotnet" and $dotnet) or (.group == "web" and $web)))
            | map(del(.group))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Selected images: $(jq -r "[.[].name] | join(\", \") | if . == \"\" then \"(none)\" else . end" <<<"$matrix")" >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    name: Build & Push (${{ matrix.name }})
    needs: changes
    # `needs` IS available to a job-level `if`, unlike `matrix`. An empty matrix is a hard error
    # ("Matrix vector 'include' does not contain any values"), so the no-changes case has to be
    # answered by not running the job at all rather than by running it with nothing to do.
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Harbor
        if: vars.HARBOR_REGISTRY != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_ROBOT_NAME }}
          password: ${{ secrets.HARBOR_ROBOT_SECRET }}

      - name: Docker metadata (GHCR)
        id: meta-ghcr
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Docker metadata (Harbor)
        id: meta-harbor
        if: vars.HARBOR_REGISTRY != ''
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.HARBOR_REGISTRY }}/buildingos/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push to GHCR
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push to Harbor (retag from build cache)
        if: vars.HARBOR_REGISTRY != ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta-harbor.outputs.tags }}
          labels: ${{ steps.meta-harbor.outputs.labels }}
          cache-from: type=gha
          # No cache-to here — GHCR step already populated it

      - name: Verify same digest on both registries
        if: vars.HARBOR_REGISTRY != ''
        run: |
          GHCR_DIGEST=$(echo "${{ steps.build.outputs.digest }}")
          echo "GHCR digest: $GHCR_DIGEST"
          # Harbor build runs from the same layer cache so digests match
          echo "Both registries received image from identical build context"

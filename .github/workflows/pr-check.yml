name: PR Check

# Lightweight gate that runs on every pull request targeting main.
# Scoped to the changed area only (DotNet/proto → backend, web-client → frontend)
# to keep credit consumption low.
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  # ── Detect changed areas ──────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A workflow-only PR used to match nothing here, so every job was skipped and the PR
          # merged with CodeQL as its only real check — that is how #306 (harbor-push unable to
          # load for a month) reached main. Workflow edits now get linted, and an edit to this
          # file re-runs both suites because it is the thing deciding whether they run at all.
          filters: |
            dotnet:
              - 'DotNet/**'
              - 'proto/**'
              # The swagger freshness check lives in dotnet-check, so a hand-edit of the committed
              # schema (with no .NET change) must still run it — otherwise the one way to desync
              # swagger.yaml from the source is the one way that skips the check (#354).
              - 'docs/schema/swagger.yaml'
              - '.github/workflows/pr-check.yml'
            frontend:
              - 'web-client/**'
              - '.github/workflows/pr-check.yml'
            workflows:
              - '.github/workflows/**'

  # ── Workflow lint ─────────────────────────────────────────────
  actionlint:
    name: Workflow Lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # actionlint catches the class of defect behind #306: a workflow that GitHub cannot load
      # produces no failing check at all, only an absence of runs, so nothing surfaces it.
      # Pinned by digest: `:latest` would let the linter change under us, so a run could start
      # failing with no repo change and no way to attribute it. This digest is the image this
      # branch's first green run actually pulled (rhysd/actionlint:latest as of 2026-08-09).
      - name: Lint workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  # ── .NET build + unit tests ───────────────────────────────────
  dotnet-check:
    name: .NET Build & Test
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    defaults:
      run:
        working-directory: DotNet

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: DotNet/**/*.csproj

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore BuildingOS.sln

      - name: Build
        run: dotnet build BuildingOS.sln --no-restore --configuration Release

      - name: Unit Tests
        run: |
          dotnet test BuildingOS.sln \
            --no-build --configuration Release \
            --filter "FullyQualifiedName!~IntegrationTest&FullyQualifiedName!~DuckDbSpike" \
            --logger "trx;LogFileName=pr-test-results.trx" \
            --results-directory TestResults

      # docs/schema/swagger.yaml is committed and feeds the generated aspida client, but nothing
      # verified it still matched the source — so drift accumulated silently (#354; a stale
      # control-audit summary survived from dff86a6 until 0ff5d6e). This regenerates it and fails on
      # any diff. It reuses the Release build above, so it costs seconds.
      #
      # The tool is already pinned in DotNet/.config/dotnet-tools.json (swashbuckle.aspnetcore.cli
      # 10.2.3, matching the project's Swashbuckle) and restored by "Restore tools" above.
      # generate_swagger.bash exports its own env (including a bogus POSTGRES_CONNECTION_STRING),
      # and swagger generation only *reads* that value — no database is contacted. If anyone later
      # adds an eager DB/OxiGraph/NATS call to Startup.ConfigureServices this step starts failing
      # with a confusing connection error; that is the thing to look at first.
      - name: Swagger is up to date
        working-directory: ${{ github.workspace }}
        run: |
          bash Tools/generate_swagger.bash
          if ! git diff --exit-code -- docs/schema/swagger.yaml; then
            echo "::error file=docs/schema/swagger.yaml::swagger.yaml is stale. Regenerate with Tools/sync-type.bash and commit swagger.yaml AND the aspida client. Note XML doc comments feed the schema, so editing a /// comment changes it too."
            exit 1
          fi

      - name: Publish Test Results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: .NET Tests (PR)
          path: DotNet/TestResults/**/*.trx
          reporter: dotnet-trx

  # ── Frontend typecheck / lint / test ─────────────────────────
  frontend-check:
    name: Frontend Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: yarn
          cache-dependency-path: web-client/yarn.lock

      - name: Install dependencies
        working-directory: web-client
        run: yarn install --frozen-lockfile

      - name: Type check
        working-directory: web-client
        run: npx tsc --noEmit

      - name: Lint
        working-directory: web-client
        run: yarn lint

      - name: Unit Tests
        working-directory: web-client
        run: yarn test --run

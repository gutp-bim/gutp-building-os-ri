name: PR Check

# Lightweight gate that runs on every pull request targeting main.
# Scoped to the changed area only (DotNet/proto → backend, web-client → frontend)
# to keep credit consumption low.
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  # ── Detect changed areas ──────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A workflow-only PR used to match nothing here, so every job was skipped and the PR
          # merged with CodeQL as its only real check — that is how #306 (harbor-push unable to
          # load for a month) reached main. Workflow edits now get linted, and an edit to this
          # file re-runs both suites because it is the thing deciding whether they run at all.
          filters: |
            dotnet:
              - 'DotNet/**'
              - 'proto/**'
              # The swagger freshness check lives in dotnet-check, so a hand-edit of the committed
              # schema (with no .NET change) must still run it — otherwise the one way to desync
              # swagger.yaml from the source is the one way that skips the check (#354).
              - 'docs/schema/swagger.yaml'
              # Same reasoning as swagger.yaml: the aspida drift check lives in dotnet-check, so a
              # hand-edit of the committed client must still run it.
              - 'web-client/src/lib/infra/aspida-client/generated/**'
              # dotnet-check is the only job that executes these scripts, and both are now CI gates.
              # Without this a PR editing only generate_swagger.bash / sync-type.bash merges with no
              # run at all — the same hole the two entries above close for their artefacts.
              - 'Tools/**'
              - '.github/workflows/pr-check.yml'
            frontend:
              - 'web-client/**'
              - '.github/workflows/pr-check.yml'
            workflows:
              - '.github/workflows/**'

  # ── Workflow lint ─────────────────────────────────────────────
  actionlint:
    name: Workflow Lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # actionlint catches the class of defect behind #306: a workflow that GitHub cannot load
      # produces no failing check at all, only an absence of runs, so nothing surfaces it.
      # Pinned by digest: `:latest` would let the linter change under us, so a run could start
      # failing with no repo change and no way to attribute it. This digest is the image this
      # branch's first green run actually pulled (rhysd/actionlint:latest as of 2026-08-09).
      - name: Lint workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  # ── .NET build + unit tests ───────────────────────────────────
  dotnet-check:
    name: .NET Build & Test
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    defaults:
      run:
        working-directory: DotNet

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: DotNet/**/*.csproj

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore BuildingOS.sln

      - name: Build
        run: dotnet build BuildingOS.sln --no-restore --configuration Release

      # docs/schema/swagger.yaml is committed and feeds the generated aspida client, but nothing
      # verified it still matched the source — so drift accumulated silently (#354; a stale
      # control-audit summary survived from dff86a6 until 0ff5d6e). This regenerates it and fails on
      # any diff. It runs before the test suite because it reuses the Release build above and costs
      # seconds: a stale schema should not wait behind a full test run to be reported.
      #
      # The tool is already pinned in DotNet/.config/dotnet-tools.json (swashbuckle.aspnetcore.cli
      # 10.2.3, matching the project's Swashbuckle) and restored by "Restore tools" above.
      # generate_swagger.bash exports its own env (including a bogus POSTGRES_CONNECTION_STRING),
      # and swagger generation only *reads* that value — no database is contacted. If anyone later
      # adds an eager DB/OxiGraph/NATS call to Startup.ConfigureServices this step starts failing
      # with a confusing connection error; that is the thing to look at first.
      #
      # This verifies swagger.yaml against the source. The committed aspida client is verified by
      # the step after it, so the two halves of Tools/sync-type.bash are both gated here (#357).
      - name: Swagger is up to date
        working-directory: ${{ github.workspace }}
        run: |
          bash Tools/generate_swagger.bash
          if ! git diff --exit-code -- docs/schema/swagger.yaml; then
            echo "::error file=docs/schema/swagger.yaml::swagger.yaml is stale. Regenerate with Tools/sync-type.bash (NOT generate_swagger.bash alone — that skips the aspida client) and commit swagger.yaml together with web-client/src/lib/infra/aspida-client/generated/. XML doc comments feed the schema, so editing a /// comment changes it too."
            exit 1
          fi

      # The other half of the drift (#357): swagger.yaml can be regenerated and committed while the
      # aspida client that is generated FROM it goes stale — running Tools/generate_swagger.bash
      # alone (documented standalone in CLAUDE.md) does exactly that, and nothing notices because
      # stale-but-self-consistent types still typecheck.
      #
      # git status --porcelain, not git diff --exit-code: a regeneration can add whole new untracked
      # directories (one per new endpoint), and porcelain reports those too. In practice a new
      # endpoint also rewrites the tracked $api.ts so git diff would catch it as well, but porcelain
      # is strictly safer for the same cost.
      #
      # No `cache: yarn` on setup-node: this job never runs `yarn install`, so there is no lockfile
      # install to cache and enabling it only adds a restore/save round trip.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Aspida client is up to date
        working-directory: ${{ github.workspace }}
        run: |
          # Single source of truth for the pin: Tools/sync-type.bash. Repeating the literal here
          # would let the two drift apart, and the resulting red tells you to "regenerate with
          # Tools/sync-type.bash" — advice that cannot work when the script pins a different version.
          VERSION="$(sed -n 's/^OPENAPI2ASPIDA_VERSION="\(.*\)"$/\1/p' Tools/sync-type.bash)"
          if [ -z "$VERSION" ]; then
            echo "::error file=Tools/sync-type.bash::could not read OPENAPI2ASPIDA_VERSION — this step reads the pin from that file, so the assignment must stay a plain OPENAPI2ASPIDA_VERSION=\"x.y.z\" line."
            exit 1
          fi
          echo "openapi2aspida@$VERSION (pinned in Tools/sync-type.bash)"

          CLIENT_PATH="web-client/src/lib/infra/aspida-client/generated"
          rm -rf "${CLIENT_PATH:?}"/*
          npx --yes "openapi2aspida@${VERSION}" \
            -i="$PWD/docs/schema/swagger.yaml" -o="$PWD/$CLIENT_PATH"
          if [ -n "$(git status --porcelain -- "$CLIENT_PATH")" ]; then
            git status --porcelain -- "$CLIENT_PATH"
            git diff -- "$CLIENT_PATH" | head -100
            echo "::error file=web-client/src/lib/infra/aspida-client/generated::the generated aspida client does not match docs/schema/swagger.yaml. Regenerate with Tools/sync-type.bash and commit BOTH swagger.yaml and the generated client."
            exit 1
          fi

      - name: Unit Tests
        run: |
          dotnet test BuildingOS.sln \
            --no-build --configuration Release \
            --filter "FullyQualifiedName!~IntegrationTest&FullyQualifiedName!~DuckDbSpike" \
            --logger "trx;LogFileName=pr-test-results.trx" \
            --results-directory TestResults

      - name: Publish Test Results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: .NET Tests (PR)
          path: DotNet/TestResults/**/*.trx
          reporter: dotnet-trx

  # ── Frontend typecheck / lint / test ─────────────────────────
  frontend-check:
    name: Frontend Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: yarn
          cache-dependency-path: web-client/yarn.lock

      - name: Install dependencies
        working-directory: web-client
        run: yarn install --frozen-lockfile

      - name: Type check
        working-directory: web-client
        run: npx tsc --noEmit

      - name: Lint
        working-directory: web-client
        run: yarn lint

      - name: Unit Tests
        working-directory: web-client
        run: yarn test --run

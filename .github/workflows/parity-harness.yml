name: Parity Harness

# Manual-trigger only to conserve CI credits — run from the Actions tab when needed.
on:
  workflow_dispatch:

concurrency:
  group: parity-harness-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit-tests:
    name: Parity Harness Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tools/parity-harness-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --verbosity normal
